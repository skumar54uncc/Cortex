name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests + eval
        run: npm run test

      - name: Production build
        run: npm run build

  eval:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            retrieval:
              - 'src/lib/search-engine.ts'
              - 'src/lib/chunking.ts'
              - 'src/lib/query-parse.ts'
              - 'src/offscreen/**'
              - 'src/db/schema.ts'
              - 'eval/corpus/**'
              - 'eval/queries/**'
              - 'eval/src/**'

      - name: Skip — no retrieval paths changed
        if: steps.filter.outputs.retrieval != 'true'
        run: echo "Eval job skipped (no matching paths)."

      - uses: actions/setup-node@v4
        if: steps.filter.outputs.retrieval == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        if: steps.filter.outputs.retrieval == 'true'
        run: npm ci

      - name: Prepare model
        if: steps.filter.outputs.retrieval == 'true'
        run: npm run prepare-model

      - name: Build extension
        if: steps.filter.outputs.retrieval == 'true'
        run: npm run build

      - name: Cache embedding artifacts
        if: steps.filter.outputs.retrieval == 'true'
        uses: actions/cache@v4
        with:
          path: eval/.cache/embeddings
          key: eval-embed-${{ runner.os }}-${{ hashFiles('vendor/models/**') }}

      - name: Seed corpus JSONL
        if: steps.filter.outputs.retrieval == 'true'
        run: npm run eval:seed

      - name: Warm embedding cache
        if: steps.filter.outputs.retrieval == 'true'
        run: npx tsx eval/src/cli.ts

      - name: Run retrieval eval
        id: eval
        if: steps.filter.outputs.retrieval == 'true'
        continue-on-error: true
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -n "$PR_BODY" ] && echo "$PR_BODY" | grep -q '\[eval-override:'; then
            npm run eval -- --ci --eval-override
          else
            npm run eval -- --ci
          fi

      - name: Upload eval results
        if: steps.filter.outputs.retrieval == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results/run-*.json

      - name: Comment PR on eval failure
        if: steps.filter.outputs.retrieval == 'true' && steps.eval.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## Eval regression\n\nRetrieval eval failed (\`npm run eval -- --ci\`). See workflow artifacts for \`run-*.json\`.\n\nTo override, add \`[eval-override: reason]\` to the PR description.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail job if eval failed
        if: steps.filter.outputs.retrieval == 'true' && steps.eval.outcome == 'failure'
        run: exit 1
