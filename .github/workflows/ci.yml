name: CI

on:
  push:
    branches: [main, master, "release/**"]
  pull_request:
    branches: [main, master]

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Audit shipped dependencies (no high or critical)
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests + eval tests
        run: npm run test

      - name: Production build
        run: npm run build

      - name: Bundle budget
        run: npm run check:budget

      - name: SBOM (CycloneDX, shipped dependencies)
        run: npm run sbom

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cdx.json

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7

  e2e:
    runs-on: ubuntu-latest
    needs: build-test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Build axe audit variant (dist-e2e, open overlay shadow root)
        run: npm run build:e2e

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E + axe (unpacked extension in Chromium)
        run: npm run e2e

      - name: Upload axe report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: axe-report
          path: docs/release-1.2.0/axe-report.json

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results

  eval:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install
        run: npm ci

      - name: Cache embedding artifacts
        uses: actions/cache@v4
        with:
          path: eval/.cache/embeddings
          key: eval-embed-v2-${{ runner.os }}-${{ hashFiles('vendor/models/**', 'eval/corpus/**', 'package-lock.json') }}

      - name: Seed corpus JSONL
        run: npm run eval:seed

      - name: Warm embedding cache
        run: npx tsx eval/src/cli.ts

      - name: Run retrieval eval (gate)
        id: eval
        continue-on-error: true
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if [ -n "$PR_BODY" ] && echo "$PR_BODY" | grep -q '\[eval-override:'; then
            npm run eval -- --ci --eval-override
          else
            npm run eval -- --ci
          fi

      - name: Upload eval results
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval/results/run-*.json

      - name: Comment PR on eval failure
        if: steps.eval.outcome == 'failure' && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const body = `## Eval regression\n\nRetrieval eval failed (\`npm run eval -- --ci\`). See workflow artifacts for \`run-*.json\`.\n\nTo override, add \`[eval-override: reason]\` to the PR description.`;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Fail job if eval failed
        if: steps.eval.outcome == 'failure'
        run: exit 1
